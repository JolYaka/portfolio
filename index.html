<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Génie Électrique</title>
  <meta name="description" content="Portfolio d'un étudiant en génie électrique." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navigation -->
  <header class="nav" id="nav">
    <a href="#top" class="nav__brand" data-bind="name">&nbsp;</a>
    <nav class="nav__links">
      <a href="#about">À propos</a>
      <a href="#skills">Compétences</a>
      <a href="#projects">Projets</a>
      <a href="#stages">Stages</a>
      <a href="#parcours">Parcours</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="nav__lock" id="lockBtn" title="Mode édition" aria-label="Mode édition">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
      </svg>
    </button>
  </header>

  <main id="app"><!-- Rendu par script.js --></main>

  <footer class="footer">
    <span data-bind="name">&nbsp;</span> · <span id="year"></span>
    <span class="footer__edit">Espace privé : icône cadenas en haut à droite.</span>
  </footer>

  <!-- Barre d'outils d'édition -->
  <div class="toolbar" id="toolbar" hidden>
    <span class="toolbar__tag">Mode édition</span>
    <button data-action="save" class="btn btn--primary">Enregistrer</button>
    <button data-action="export" class="btn">Exporter</button>
    <button data-action="import" class="btn">Importer</button>
    <button data-action="code" class="btn">Changer le code</button>
    <button data-action="reset" class="btn btn--ghost">Réinitialiser</button>
    <button data-action="exit" class="btn btn--ghost">Quitter</button>
  </div>

  <!-- Modale : saisie du code -->
  <div class="modal" id="codeModal" hidden>
    <div class="modal__card">
      <h3 class="modal__title">Accès édition</h3>
      <p class="modal__text">Entre le code pour modifier le portfolio.</p>
      <input type="password" id="codeInput" class="field" inputmode="numeric" autocomplete="off" placeholder="Code d'accès" />
      <p class="modal__error" id="codeError" hidden>Code incorrect.</p>
      <div class="modal__actions">
        <button class="btn btn--ghost" data-close>Annuler</button>
        <button class="btn btn--primary" id="codeSubmit">Déverrouiller</button>
      </div>
    </div>
  </div>

  <!-- Modale : changement de code -->
  <div class="modal" id="changeCodeModal" hidden>
    <div class="modal__card">
      <h3 class="modal__title">Changer le code</h3>
      <input type="password" id="newCode1" class="field" autocomplete="new-password" placeholder="Nouveau code" />
      <input type="password" id="newCode2" class="field" autocomplete="new-password" placeholder="Confirmer le nouveau code" />
      <p class="modal__error" id="changeCodeError" hidden></p>
      <div class="modal__actions">
        <button class="btn btn--ghost" data-close>Annuler</button>
        <button class="btn btn--primary" id="changeCodeSubmit">Valider</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <input type="file" id="importFile" accept="application/json" hidden />

  <script src="script.js"></script>
</body>
</html>
